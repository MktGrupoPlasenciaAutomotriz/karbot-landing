name: Deploy landing.karbot.mx

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-karbot-explicit
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare _site
        run: |
          mkdir -p _site
          rsync -av --exclude '.github/' --exclude '_site/' --exclude '*.md' ./ _site/
          echo "landing.karbot.mx" > _site/CNAME
          find _site -type f | wc -l
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
